        //    Ou

        const n1 = Number(prompt("digite sua nota 1"))
        const n2 = Number(prompt("digite sua nota 2"))
        const media = (n1 + n2) / 2;

        if(media >= 7) {
            alert(`Aluno Aprovado com média: ${media}`)
        } else if(media >= 5) {
            alert(`Aluno em Recuperação: ${media}`)

            alert(`Aluno Reprovado com média: ${media}`)
