<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>While</title>
</head>
<body>
    <script>
        // While = Enquanto
        
        let codigo = ''
        while(codigo != 'sair') {
            codigo = prompt("Digite qualquer Letra. Para parar esse programa. Você deve didgitar 'sair'")
            alert(codigo);
        }   



    </script>
</body>
</html>
